<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="41" y="41" width="430" height="430" rx="92" ry="92" fill="url(#bg)"/>

  <!-- Subtle shine overlay -->
  <rect x="41" y="41" width="430" height="215" rx="92" ry="92" fill="url(#shine)"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Letter K -->
  <text
    x="256"
    y="337"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="225"
    fill="white"
    text-anchor="middle"
    filter="url(#shadow)"
    letter-spacing="-5"
  >K</text>

  <!-- Orange accent dot -->
  <circle cx="256" cy="366" r="22" fill="#fed7aa"/>
  <circle cx="256" cy="366" r="11" fill="rgba(255,255,255,0.5)"/>
</svg>