<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="26" height="26" rx="6" ry="6" fill="url(#bg)"/>

  <!-- Subtle shine overlay -->
  <rect x="3" y="3" width="26" height="13" rx="6" ry="6" fill="url(#shine)"/>

  <!-- Decorative ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0"/>

  <!-- Letter K -->
  <text
    x="16"
    y="21"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="14"
    fill="white"
    text-anchor="middle"
    filter="url(#shadow)"
    letter-spacing="-0"
  >K</text>

  <!-- Orange accent dot -->
  <circle cx="16" cy="23" r="1" fill="#fed7aa"/>
  <circle cx="16" cy="23" r="1" fill="rgba(255,255,255,0.5)"/>
</svg>