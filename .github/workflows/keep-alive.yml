name: Keep Render Backend Alive

# Runs on a schedule in GitHub's cloud 24/7 (regardless of whether laptop is on or off)
# Prevents Render free tier from sleeping after 15 minutes of inactivity

on:
  schedule:
    # Trigger every 10 minutes (*:00, *:10, *:20, *:30, *:40, *:50)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    name: Ping Render Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Workshop Hub API
        run: |
          echo "Sending keep-alive ping to Render backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://workshop-registration-system-9fbd.onrender.com/api/workshops" || true)
          echo "Render Backend HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend is healthy and warm!"
          else
            echo "Wake-up ping registered, status: $STATUS"
          fi
