# ===================================================================
# WorkshopHub - Workshop Registration System Configuration
# ===================================================================

# Server Port
server.port=8080

# Spring MVC JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/,/WEB-INF/jsp/

# Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kaushalya_db}
spring.data.mongodb.auto-index-creation=${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}

# Bootstrap Super Admin Credentials for First Run
workshophub.admin.email=${ADMIN_EMAIL:admin@workshophub.edu}
workshophub.admin.password=${ADMIN_PASSWORD:}
workshophub.admin.name=System Administrator

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.workshophub=INFO
logging.level.org.springframework.security=WARN

# JWT Configuration
jwt.secret=${JWT_SECRET:}

# Application Base URL (Frontend)
app.frontend.url=${APP_FRONTEND_URL:https://workshop-registration-system-peach.vercel.app}

# Mail Configuration (JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.mode=${RAZORPAY_MODE:test}

# Cloudinary CDN Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

