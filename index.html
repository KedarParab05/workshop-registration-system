<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaushalya | Learn. Build. Grow. - Academic Workshop & Skills Platform</title>
    <meta name="description" content="Kaushalya (कौशल्य) — Production-grade academic workshop registration and capacity governance platform. Learn hands-on skills, save free seats, and verify digital QR passes." />
    <meta property="og:title" content="Kaushalya | Learn. Build. Grow." />
    <meta property="og:description" content="A modern academic platform for workshops, skills, and opportunities with instant digital QR passes and gate verification." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA / App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaushalya" />
    <meta name="application-name" content="Kaushalya" />
    <meta name="msapplication-TileColor" content="#0a2e14" />
    <meta name="theme-color" content="#0a2e14" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Splash screen style (shows before React mounts) -->
    <style>
      #kaushalya-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: linear-gradient(145deg, #1a0a00 0%, #7c2d12 60%, #431407 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: opacity 0.55s ease, transform 0.55s ease;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #kaushalya-splash.fade-out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      .splash-logo-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 28px;
      }
      .splash-logo-bg {
        width: 110px;
        height: 110px;
        border-radius: 26px;
        background: linear-gradient(145deg, #c2410c, #ea580c);
        box-shadow: 0 8px 40px rgba(234,88,12,0.5), 0 0 0 1px rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .splash-logo-bg::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, rgba(255,255,255,0.15) 0%, transparent 60%);
        border-radius: inherit;
      }
      .splash-k {
        font-size: 58px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -2px;
        line-height: 1;
        text-shadow: 0 2px 12px rgba(0,0,0,0.4);
        position: relative;
        z-index: 1;
      }
      .splash-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fed7aa;
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 10px #fb923c;
      }
      .splash-ring {
        position: absolute;
        inset: 8px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.15);
        pointer-events: none;
      }
      .splash-title {
        font-size: 30px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
        margin: 0 0 4px 0;
        line-height: 1.1;
      }
      .splash-title span {
        color: #fb923c;
      }
      .splash-tagline {
        font-size: 13px;
        color: rgba(255,255,255,0.5);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
        margin: 0 0 44px 0;
      }
      .splash-loader {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .splash-dot-pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fb923c;
        animation: splashPulse 1.2s ease-in-out infinite;
      }
      .splash-dot-pulse:nth-child(2) { animation-delay: 0.2s; }
      .splash-dot-pulse:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splashPulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.1); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://kaushalya-oauu.onrender.com">
    <link rel="preconnect" href="https://kaushalya-oauu.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://checkout.razorpay.com">
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.razorpay.com">
    <link rel="preconnect" href="https://api.razorpay.com" crossorigin>
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    <script>
      (function() {
        try {
          // Immediate background wakeup ping to eliminate backend cold-start delays
          fetch("https://kaushalya-oauu.onrender.com/api/workshops", {
            method: "GET",
            mode: "cors",
            keepalive: true
          }).catch(function() {});
        } catch (e) {}
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,600,700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('wh_theme');
          // Strict requirement: Light mode is default for all first-time visitors
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  </head>
  <body>
    <!-- App Splash Screen — visible until React mounts -->
    <div id="kaushalya-splash">
      <div class="splash-logo-wrap">
        <div class="splash-logo-bg">
          <div class="splash-ring"></div>
          <span class="splash-k">K</span>
          <div class="splash-dot"></div>
        </div>
      </div>
      <h1 class="splash-title">Kaushal<span>ya</span></h1>
      <p class="splash-tagline">Learn · Build · Grow</p>
      <div class="splash-loader">
        <div class="splash-dot-pulse"></div>
        <div class="splash-dot-pulse"></div>
        <div class="splash-dot-pulse"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Dismiss splash once React has rendered -->
    <script>
      (function() {
        function hideSplash() {
          var el = document.getElementById('kaushalya-splash');
          if (!el) return;
          el.classList.add('fade-out');
          setTimeout(function() { el && el.parentNode && el.parentNode.removeChild(el); }, 600);
        }
        // Hide after React root has children OR after 3s max
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            setTimeout(hideSplash, 300);
          }
        });
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        setTimeout(hideSplash, 3500);
      })();
    </script>
  </body>
</html>
